name: Release Enterprise Solutions

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Validate and release enterprise solutions
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up CUE
        uses: cue-lang/setup-cue@v1.0.0

      - name: Validate solution definitions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          if [[ "${RELEASE_TAG}" == *-test ]]; then
            documents=(testing/pomology.json)
          else
            documents=()
            for document in */pomology.json; do
              [[ "${document%%/*}" == "testing" ]] && continue
              documents+=("${document}")
            done
          fi

          if (( ${#documents[@]} == 0 )); then
            echo "::error::No solution Pomology documents found."
            exit 1
          fi

          for document in "${documents[@]}"; do
            echo "Validating ${document}"
            cue vet -c pomology.cue "${document}"
          done

      - name: Package enterprise solutions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          if [[ "${RELEASE_TAG}" == *-test ]]; then
            documents=(testing/pomology.json)
          else
            documents=()
            for document in */pomology.json; do
              [[ "${document%%/*}" == "testing" ]] && continue
              documents+=("${document}")
            done
          fi

          mkdir -p dist/release
          cp pomology.cue dist/release/

          for document in "${documents[@]}"; do
            solution="${document%%/*}"
            echo "Packaging ${solution}"
            cp -R "${solution}" dist/release/
          done

          (
            cd dist/release
            zip -r "../enterprise_solutions-${RELEASE_TAG}.zip" .
          )

      - name: Generate build provenance attestation
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/enterprise_solutions-${{ github.ref_name }}.zip

      - name: Prepare release attestation predicate
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail

          jq -n \
            --arg purl "pkg:github/${REPOSITORY}@${RELEASE_TAG}" \
            --arg packageId "${REPOSITORY_ID}" \
            '{
              purl: $purl,
              packageId: $packageId
            }' > dist/release-predicate.json

      - name: Generate release attestation
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/enterprise_solutions-${{ github.ref_name }}.zip
          predicate-type: https://in-toto.io/attestation/release/v0.2
          predicate-path: dist/release-predicate.json

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${RELEASE_TAG}" \
            --draft \
            --verify-tag \
            --title "Enterprise Solutions ${RELEASE_TAG}" \
            --generate-notes

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          gh release upload "${RELEASE_TAG}" \
            "dist/enterprise_solutions-${RELEASE_TAG}.zip"

          for document in dist/release/*/pomology.json; do
            solution="${document%/pomology.json}"
            solution="${solution##*/}"

            asset="dist/${solution}-pomology.json"
            cp "$document" "$asset"

            gh release upload "${RELEASE_TAG}" "$asset"
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release edit "${RELEASE_TAG}" --draft=false